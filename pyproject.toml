[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantica-northstar-authz-poc"
version = "0.1.0"
description = "Time-aware Northstar document authorization proof of concept using Semantica"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "semantica>=0.5.0",
  "rdflib>=7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["northstar_authz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
